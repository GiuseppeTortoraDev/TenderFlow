name: TenderFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test-backend:
    name: Build & Test Quarkus Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run backend tests
        working-directory: ./backend
        run: mvn clean verify

      - name: Build Backend Docker Image (Dry-Run)
        run: docker compose build backend

  build-and-test-frontend:
    name: Build & Test Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm test

      - name: Build Angular production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Build Frontend Docker Image (Dry-Run)
        run: docker compose build frontend